<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modularity Networks | Client Demo Sites</title>
<style>
  :root {
    --paper: #faf7f1;
    --ink: #2b2a24;
    --ink-soft: #5c584c;
    --pine: #2f4a3c;
    --line: #e1dac9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, 'Segoe UI', Inter, Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.6;
    padding: 64px 24px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.9rem; font-weight: 700; color: var(--pine); margin-bottom: 8px; }
  p.lead { color: var(--ink-soft); margin-bottom: 40px; }
  ul { list-style: none; }
  li {
    border: 1.5px solid var(--line);
    border-radius: 6px;
    padding: 18px 20px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  a { color: var(--pine); text-decoration: none; font-weight: 600; }
  a:hover { text-decoration: underline; }
  .tag { font-size: 12.5px; color: var(--ink-soft); }
  footer { margin-top: 48px; font-size: 13px; color: var(--ink-soft); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Client Demo Sites</h1>
    <p class="lead">Sample homepage mockups built for local business prospects. Not live business sites, just previews.</p>
    <ul>
      <li><a href="/preston-country-market/">Preston Country Market</a><span class="tag">Starrucca, PA</span></li>
    </ul>
    <footer>Modularity Networks</footer>
  </div>
</body>
</html>
